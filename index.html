
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3d - Tactile Icon Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/clay-studio.png" type="image/x-icon">
    <style>
      :root {
        --clay-bg: #f3f5f9;
        --clay-shadow: #d1d9e6;
        --clay-highlight: #ffffff;
        --accent-purple: #d8b4fe;
        --accent-yellow: #fef08a;
        --text-main: #4a5568;
        --text-dim: #94a3b8;
        --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      [data-theme='dark'] {
        --clay-bg: #0c0d12;
        --clay-shadow: #020205;
        --clay-highlight: #1a1c24;
        --accent-purple: #a78bfa;
        --accent-yellow: #fbbf24;
        --text-main: #f8fafc;
        --text-dim: #64748b;
      }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--clay-bg);
        color: var(--text-main);
        overflow: hidden;
        transition: background-color 0.8s var(--spring), color 0.5s ease;
      }

      /* Mesh Gradient Background */
      .studio-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-color: var(--clay-bg);
        transition: background-color 1s ease;
        overflow: hidden;
      }

      .mesh-blob {
        position: absolute;
        width: 80vw;
        height: 80vw;
        filter: blur(140px);
        opacity: 0.2;
        border-radius: 50%;
        transition: background-color 2s ease-in-out;
        pointer-events: none;
        animation: drift 20s ease-in-out infinite alternate;
      }

      @keyframes drift {
        0% { transform: translate(-10%, -10%) scale(1); }
        100% { transform: translate(10%, 10%) scale(1.2); }
      }

      /* Tactile Noise Overlay */
      .grain-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      .clay-raised {
        background: var(--clay-bg);
        box-shadow: 
          10px 10px 20px var(--clay-shadow),
          -10px -10px 20px var(--clay-highlight);
        border-radius: 2rem;
        transition: all 0.5s var(--spring);
        backdrop-filter: blur(12px);
      }

      .clay-inset {
        background: var(--clay-bg);
        box-shadow: 
          inset 6px 6px 12px var(--clay-shadow),
          inset -6px -6px 12px var(--clay-highlight);
        border-radius: 1.25rem;
        transition: all 0.5s var(--spring);
      }

      .clay-btn {
        background: var(--clay-bg);
        box-shadow: 
          5px 5px 10px var(--clay-shadow),
          -5px -5px 10px var(--clay-highlight);
        border-radius: 1rem;
        transition: all 0.4s var(--spring);
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.03);
      }

      .clay-btn:hover {
        transform: translateY(-3px) scale(1.03);
        box-shadow: 10px 10px 20px var(--clay-shadow), -10px -10px 20px var(--clay-highlight);
      }

      .clay-btn:active {
        transform: translateY(1px) scale(0.97);
        box-shadow: inset 4px 4px 8px var(--clay-shadow), inset -4px -4px 8px var(--clay-highlight);
      }

      .clay-pill-active {
        background: linear-gradient(135deg, var(--accent-purple), var(--accent-yellow));
        box-shadow: 0 8px 16px -4px rgba(167, 139, 250, 0.3);
        color: white;
      }

      .text-inflated {
        font-weight: 800;
        letter-spacing: -0.04em;
        background: linear-gradient(to bottom, var(--text-main), var(--text-dim));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Transitions */
      .expand-container {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.5s var(--spring);
      }
      .expand-container.open { grid-template-rows: 1fr; }
      .expand-content { overflow: hidden; }

      .dropdown-pop { animation: dropdownPop 0.3s var(--spring) forwards; }
      @keyframes dropdownPop {
        from { opacity: 0; transform: scale(0.9) translateY(-10px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }

      @keyframes claySquish {
        0% { transform: scale(1); }
        50% { transform: scale(0.95); }
        100% { transform: scale(1); }
      }
      .animate-squish { animation: claySquish 0.6s var(--spring); }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: var(--clay-shadow);
        border-radius: 10px;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div class="grain-overlay"></div>
    <div class="studio-bg" id="studioBg">
      <div class="mesh-blob" id="blob1" style="top: -20%; left: -20%; animation-delay: -5s;"></div>
      <div class="mesh-blob" id="blob2" style="bottom: -20%; right: -20%;"></div>
    </div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
